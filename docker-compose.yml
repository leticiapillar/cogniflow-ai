services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cogniflow_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cogniflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cogniflow_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cogniflow_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cogniflow} -d ${POSTGRES_DB:-cogniflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:


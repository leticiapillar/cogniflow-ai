services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cogniflow_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cogniflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cogniflow_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cogniflow_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cogniflow} -d ${POSTGRES_DB:-cogniflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: cogniflow_ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      # Requisições atendidas em paralelo por modelo. 1 mantém o uso de memória previsível
      # (llama3.2:3b + bge-m3 ≈ 4 GB de RAM); aumente se houver memória sobrando.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama_init:
    image: ollama/ollama:latest
    container_name: cogniflow_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama pull ${OLLAMA_EMBEDDING_MODEL:-bge-m3} && ollama pull ${OLLAMA_LLM_MODEL:-llama3.2:3b}"
    restart: "no"

volumes:
  pgvector_data:
  ollama_data:


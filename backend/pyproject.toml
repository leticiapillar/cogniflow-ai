[project]
name = "cogniflow-backend"
version = "0.1.0"
description = "CogniFlow AI - Translating Dense Text into Visual Learning"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.5",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "pypdf>=5.0.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "testcontainers[postgres]>=4.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "llm: needs a running Ollama with the configured models (run with: pytest -m llm)",
]
addopts = "-m 'not llm'"
